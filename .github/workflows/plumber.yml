name: Plumber

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

jobs:
  plumber:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plumber Score
        uses: getplumber/plumber@d1133cdac48cfdf0c0004637ae4af38bcf9f16c7 # v0.7.11
        with:
          min-points: 85
          score-push: true
          # the code scanning upload needs a write token, which pull requests from forks do not get
          upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
